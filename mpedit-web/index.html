<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPEdit's Webpage</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        main {
            padding: 40px;
        }

        .discord-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            background: #5865F2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.2s;
        }

        .discord-button:hover {
            background: #4752C4;
            transform: translateY(-2px);
        }

        .discord-icon {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .credits {
            margin-top: 100px;
            line-height: 1.8;
        }

        .credits h2 {
            margin-bottom: 60px;
        }
    </style>
</head>

<body>
    <main>
        <h1>Multiplayer Edit Webpage (beta)</h1>
        <a
            class="discord-button"
            href="https://discord.gg/mdsuxYu2YP"
            title="https://discord.gg/mdsuxYu2YP"
            target="_blank"
            rel="noopener noreferrer"
        >
            <svg class="discord-icon" viewBox="0 0 24 24">
                <path d="M19.54 5.09A16.1 16.1 0 0 0 15.5 3.84l-.49 1a14.8 14.8 0 0 0-3.02-.3c-1.03 0-2.04.1-3.02.3l-.49-1a16.1 16.1 0 0 0-4.04 1.25C1.9 8.82 1.2 12.47 1.55 16.06a16.2 16.2 0 0 0 4.98 2.5l1.2-1.64c-.66-.25-1.3-.55-1.9-.9l.46-.35c3.67 1.72 7.64 1.72 11.27 0l.46.35c-.6.35-1.24.65-1.9.9l1.2 1.64a16.2 16.2 0 0 0 4.98-2.5c.41-4.17-.7-7.78-2.76-10.97ZM8.4 14.42c-1.08 0-1.97-.99-1.97-2.2s.87-2.2 1.97-2.2c1.1 0 1.99.99 1.97 2.2 0 1.21-.87 2.2-1.97 2.2Zm7.2 0c-1.08 0-1.97-.99-1.97-2.2s.87-2.2 1.97-2.2c1.1 0 1.99.99 1.97 2.2 0 1.21-.87 2.2-1.97 2.2Z"/>
            </svg>
            Join the Discord
        </a>
        

        <div class="credits">
            <h2>Credits</h2>
            <div>The Geode Team -> The actual SDK</div>
            <div>xXoanon/d050 -> Backend</div>
            <div>ender68/Ender -> Some of the UI</div>
        </div>
    </main>
</body>
</html>
